<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星阵</title>
    <link rel="icon" type="image/png" href="./assets/brand/starmatrix-favicon.png?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/tokens.css?v=20260711-v70" />
    <link rel="stylesheet" href="./styles/base.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/components.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/views.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/analytics.css?v=20260711-v70" />
    <link rel="stylesheet" href="./styles/agent.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/ui-motion.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/custom-creation.css?v=20260804-v140-metric-billing-control-1" />
    <link rel="stylesheet" href="./styles/client-download.css?v=20260727-v119-4" />
    <script>
      (function () {
        try {
          document.documentElement.classList.add("auth-booting");
          if (localStorage.getItem("dumate.token")) document.documentElement.classList.add("has-auth-token");
        } catch (e) {}
      })();
    </script>
    <style>
      html.auth-booting { background: #fff; }
      html.auth-booting body { visibility: hidden; }
    </style>
  </head>
  <body data-zone="home">

    <!-- 开屏 · 三身份口令登录 -->
    <div id="loginGate" class="login-gate">
      <div class="lg-auth-shell">
        <section class="lg-visual" aria-label="星阵创作平台">
          <canvas class="lg-beams" id="lgBeams" aria-hidden="true"></canvas>
          <div class="lg-visual-shade" aria-hidden="true"></div>
          <img class="lg-visual-logo" src="./assets/brand/starmatrix-mascot-blue-transparent.png?v=20260804-v140-metric-billing-control-1" alt="星阵" />
          <div class="lg-visual-copy">
            <span>创作 · 管理 · 交付</span>
            <h2>让灵感成为<br />可交付的作品</h2>
            <p>统一管理账号、素材与生成流程。</p>
          </div>
        </section>

        <section class="lg-center">
          <div class="lg-card" data-mode="login">
            <button class="lg-modal-close" id="lgModalClose" type="button" aria-label="关闭登录窗口" title="暂不登录">×</button>
            <div class="lg-brand">
              <h1 id="lgModeTitle" class="lg-mode-title" role="status" aria-live="polite" aria-atomic="true">登录</h1>
              <p id="lgHint">登录后继续你的工作区</p>
            </div>
            <div class="lg-form">
              <div class="lg-provider-actions" id="lgProviderActions">
                <button class="lg-provider-btn" id="lgPhone" type="button">
                  <img class="lg-provider-icon" src="./assets/brand/phone-mark.svg" alt="" aria-hidden="true" />
                  <span>使用手机验证</span>
                </button>
                <button class="lg-provider-btn" id="lgGoogle" type="button">
                  <img class="lg-provider-icon" src="./assets/brand/google-g-mark.png" alt="" aria-hidden="true" />
                  <span>使用 Google 快速登录</span>
                </button>
              </div>
              <div class="lg-divider" id="lgDivider"><span>或使用星阵账号</span></div>
              <label class="lg-field" id="lgUserField">
                <span class="lgf-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 11a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                <input id="lgUser" type="text" autocomplete="username" placeholder="用户名" />
              </label>
              <label class="lg-field" id="lgPinField">
                <span class="lgf-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M5 11h14v10H5z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V7a4 4 0 018 0v4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
                <input id="lgPin" type="password" autocomplete="current-password" placeholder="密码" />
              </label>
              <label class="lg-field lg-apply-only" id="lgNameField" hidden>
                <span class="lgf-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 20c1.4-3.4 4.2-5.2 8-5.2s6.6 1.8 8 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
                <input id="lgName" type="text" autocomplete="name" placeholder="姓名 / 昵称" />
                <small class="lg-real-name-hint">请使用真实姓名</small>
              </label>
              <label class="lg-field lg-apply-only" id="lgRoleField" hidden>
                <span class="lgf-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                <select id="lgRole">
                  <option value="editor">创作成员</option>
                  <option value="supplier_parent">供应商管理员</option>
                  <option value="supplier_child">供应商子账号</option>
                </select>
              </label>
              <label class="lg-field lg-forgot-only" id="lgForgotNameField" hidden>
                <span class="lgf-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 20c1.4-3.4 4.2-5.2 8-5.2s6.6 1.8 8 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span>
                <input id="lgForgotName" type="text" autocomplete="name" placeholder="填写你的姓名" />
              </label>
              <button class="lg-login" id="lgLogin" type="button">
                <span class="lg-login-label">登录</span>
              </button>
              <div class="lg-form-helper" id="lgFormHelper">
                <button class="lg-inline-link" id="lgForgot" type="button">忘记密码？</button>
              </div>
              <p class="lg-gate-error" id="lgGateError" role="alert" hidden></p>
              <p class="lg-apply-prompt" id="lgApplyPrompt"><span id="lgApplyLead">还没有账号？</span><button class="lg-inline-link" id="lgApply" type="button" aria-pressed="false"><span>注册账号</span></button></p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- 应用外壳：图标导航 + 上下文面板 + 主画布 -->
    <div class="app-shell">
      <nav class="nav-rail">
        <div class="rail-logo" id="railBrand" title="星阵"></div>
        <div class="rail-items">
          <button class="rail-item" data-nav="overview" title="首页">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>首页</span>
          </button>
          <button class="rail-item accent" data-nav="agent" title="批量创作">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 2l2.1 5.6L20 10l-5.9 2.4L12 18l-2.1-5.6L4 10l5.9-2.4L12 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>批量创作</span>
          </button>
          <button class="rail-item" data-nav="studio" title="单号创作">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 6h11v12H4z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 10l5-3v10l-5-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>单号创作</span>
          </button>
          <button class="rail-item" data-nav="custom" title="定制创作">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 2l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>定制创作</span>
          </button>
          <button class="rail-item" data-nav="assets" title="整体资产">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M3 7a2 2 0 012-2h4l2 2h9a1 1 0 011 1v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>整体资产</span>
          </button>
          <button class="rail-item" data-nav="delivery" title="发布清单">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.3 8.3L12 13l8.7-4.7M12 13v8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>发布清单</span>
          </button>
        </div>
        <div class="rail-bottom">
          <div class="client-rail-entry" id="clientRailEntry">
            <button class="rail-item" id="clientRailButton" type="button" title="下载客户端" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 4h16v11H4zM8 20h8M12 15v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7v5m0 0l-2-2m2 2l2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="clientRailLabel">客户端</span>
            </button>
            <div class="client-rail-flyout" id="clientRailFlyout" role="menu" aria-label="选择客户端系统">
              <span class="client-flyout-title">选择安装系统</span>
              <button type="button" role="menuitem" data-client-os="macos"><b>macOS</b><em>Intel + Apple 芯片</em></button>
              <button type="button" role="menuitem" data-client-os="windows"><b>Windows</b><em>Windows 10 / 11 x64</em></button>
            </div>
          </div>
          <button class="rail-item" data-nav="settings" title="设置">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.592c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.245a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a6.759 6.759 0 010 .255c-.008.378.137.75.43.992l1.003.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.489l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.542-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.245a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.242.437-.614.43-.992a6.932 6.932 0 010-.255c.007-.379-.138-.75-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.489l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281zM15 12a3 3 0 11-6 0 3 3 0 016 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>设置</span>
          </button>
          <button class="rail-item" id="navLogout" title="退出登录">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>退出</span>
          </button>
        </div>
      </nav>

      <aside class="ctx-panel" id="ctxPanel" hidden></aside>

      <div class="main-col">
        <header class="topbar">
          <div class="top-crumb" id="topCrumb">首页</div>
          <div class="top-actions" id="workspaceUtilityDock">
            <div class="top-actions-panel" id="topActionsPanel">
              <button class="top-btn" id="topSearch" title="搜索（⌘K）">
                <svg viewBox="0 0 24 24" width="15" height="15"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>搜索</span><kbd>⌘K</kbd>
              </button>
              <button class="top-btn icon" id="topBell" title="通知中心" aria-label="打开通知中心" aria-haspopup="dialog" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.3 21a2 2 0 003.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <em class="badge" id="notifyBadge" hidden></em>
              </button>
            </div>
          </div>
        </header>
        <main class="view-root" id="viewRoot"></main>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script>
      (function () {
        window.__dumateBooting = true;
        function showBootError(err) {
          var root = document.getElementById("viewRoot");
          if (!root || root.innerHTML.trim()) return;
          var msg = (err && (err.message || err.reason && err.reason.message || err.reason)) || err || "未知错误";
          root.innerHTML = '<div style="margin:32px;padding:18px 20px;border:1px solid #ffd8a8;background:#fff4e6;border-radius:14px;color:#7c2d12"><b>前端加载出错</b><p>' +
            String(msg).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }) +
            '</p><button class="btn ghost sm" onclick="location.reload()">刷新重试</button></div>';
        }
        window.addEventListener("error", function (e) { showBootError(e.error || e.message); });
        window.addEventListener("unhandledrejection", function (e) { showBootError(e.reason || e); });
        window.setTimeout(function () {
          if (window.__dumateBooting) return;
          var root = document.getElementById("viewRoot");
          var gate = document.getElementById("loginGate");
          if (!root || root.innerHTML.trim()) return;
          if (gate && !gate.hidden) return;
          root.innerHTML = '<div style="margin:32px;padding:18px 20px;border:1px solid #ffd8a8;background:#fff4e6;border-radius:14px;color:#7c2d12"><b>启动等待超时</b><p>页面外壳已加载，但数据或接口初始化没有及时完成。可以先刷新重试；如果仍出现，请点击下方按钮清理本机旧缓存后重新登录。</p><button class="btn ghost sm" id="bootReload">刷新重试</button> <button class="btn ghost sm" id="bootClearCache">清理本机缓存</button></div>';
          var reloadBtn = document.getElementById("bootReload");
          var clearBtn = document.getElementById("bootClearCache");
          if (reloadBtn) reloadBtn.addEventListener("click", function () { location.reload(); });
          if (clearBtn) clearBtn.addEventListener("click", function () {
            indexedDB.deleteDatabase("dumateStudioV5");
            localStorage.removeItem("dumate.token");
            location.reload();
          });
        }, 7000);
      })();
    </script>
    <script type="module" src="./js/main.js?v=20260804-v140-metric-billing-control-1"></script>
  </body>
</html>
